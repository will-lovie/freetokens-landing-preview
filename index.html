<!DOCTYPE html>
<meta charset="utf-8">
<title>FreeTokens</title>
<script>
(async () => {
  const ids = [...Array(20).keys()].map((i) => String(i).padStart(2, "0"));
  const parts = await Promise.all(
    ids.map((id) => fetch("parts/c" + id + ".txt").then((r) => {
      if (!r.ok) throw new Error("missing parts/c" + id + ".txt (" + r.status + ")");
      return r.text();
    }))
  );
  document.open();
  document.write(parts.join(""));
  document.close();
})().catch((e) => {
  document.body.textContent = "Failed to assemble landing page: " + e;
});
</script>
