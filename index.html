<!DOCTYPE html>
<meta charset="utf-8">
<title>FreeTokens</title>
<script>
(async () => {
  const parts = await Promise.all(
    [0,1,2,3,4,5,6,7].map((i) => fetch("parts/p" + i + ".txt").then((r) => {
      if (!r.ok) throw new Error("missing parts/p" + i + ".txt");
      return r.text();
    }))
  );
  document.open();
  document.write(parts.join(""));
  document.close();
})().catch((e) => {
  document.body.textContent = "Failed to assemble landing page: " + e;
});
</script>
